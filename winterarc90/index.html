<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WinterArc90 Live Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.umd.js"></script>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: white editorial stage. Floating glass nav, 3D logo hero, 3D podium stage, pinned horizontal category run, scroll-filled closing line. */
:root {
  /* Delta palette: white first, blue second. "ink" is Delta's deep blue, never black. */
  --white: #FFFFFF; --paper: #F3F6FE; --paper-2: #E5ECFC; --ink: #0B1F7A; --text: #1A2A6C; --muted: #5B6A9C; --line: #DDE5F8;
  --blue: #1F4FE0; --blue-deep: #0B1F7A; --blue-light: #4C86FF; --sky: #59A8FF; --peri: #A3BCFF; --wash: #EEF2FF;
  --gold: var(--blue); --silver: var(--blue-light); --bronze: var(--peri); --good: var(--blue);
  --m1: var(--blue); --m2: var(--sky); --m3: var(--blue-deep); --m4: var(--peri);
  --font: "Montserrat", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --num: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --ease: cubic-bezier(.2, .9, .2, 1);
  --spring: cubic-bezier(.3, 1.6, .5, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--white); }
body { background: var(--white); color: var(--text); font: 500 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 90; background: var(--white); }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--blue-light); outline-offset: 3px; border-radius: 8px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.eyebrow { font: 800 11.5px/1 var(--font); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* cursor */
.cur-dot, .cur-ring { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 300; display: none; }
html.cur .cur-dot, html.cur .cur-ring { display: block; }
html.cur, html.cur * { cursor: none !important; }
html.cur input[type="search"] { cursor: text !important; }
.cur-dot { width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--blue); }
.cur-ring { width: 38px; height: 38px; margin: -19px; border-radius: 50%; border: 1.5px solid var(--blue); display: none; place-items: center; transition: width .35s var(--ease), height .35s var(--ease), margin .35s var(--ease), background .3s, border-color .3s; }
html.cur .cur-ring { display: grid; }
.cur-ring.big { width: 62px; height: 62px; margin: -31px; background: color-mix(in srgb, var(--blue) 9%, transparent); }
.cur-ring.label { width: 86px; height: 86px; margin: -43px; background: var(--blue); border-color: var(--blue); }
.cur-ring span { font: 800 11px/1 var(--font); letter-spacing: .1em; text-transform: uppercase; color: #fff; opacity: 0; transition: opacity .2s; }
.cur-ring.label span { opacity: 1; }

/* preloader */
#pre { position: fixed; inset: 0; z-index: 250; display: grid; place-items: center; background: var(--white); transition: clip-path 1s cubic-bezier(.8, 0, .2, 1); clip-path: inset(0 0 0 0); }
#pre.out { clip-path: inset(0 0 100% 0); }
.pre-in { display: grid; justify-items: center; gap: 18px; }
.pre-in img { width: 92px; animation: preSpin 1.6s var(--ease) both; }
@keyframes preSpin { from { transform: rotateY(-180deg) scale(.6); opacity: 0; } }
.pre-word { font: 900 clamp(34px, 6vw, 64px)/1 var(--font); letter-spacing: -.04em; color: var(--ink); }
.pre-word span { color: var(--blue); }
.pre-line { width: min(320px, 70vw); height: 3px; background: var(--paper-2); border-radius: 9px; overflow: hidden; }
.pre-line i { display: block; height: 100%; width: calc(var(--p, 0) * 1%); background: var(--blue); }
.pre-num { font-size: 18px; font-weight: 700; color: var(--muted); }

/* nav */
.progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 3px; z-index: 95; background: var(--blue); transform-origin: 0 50%; transform: scaleX(var(--sp, 0)); }
.nav { position: fixed; z-index: 80; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 0; right: 0; margin: 0 auto; width: fit-content; display: flex; align-items: center; gap: 8px; padding: 6px; max-width: calc(100% - 32px); background: rgba(255, 255, 255, .78); backdrop-filter: blur(18px) saturate(1.7); -webkit-backdrop-filter: blur(18px) saturate(1.7); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 16px 44px -22px rgba(11, 31, 122, .45); animation: navIn 1s var(--ease) both .2s; }
@keyframes navIn { from { transform: translateY(-140%); } }
.brand { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; text-decoration: none; flex: none; }
.brand img { height: 30px; width: auto; transition: transform .6s var(--spring); }
@media (hover: hover) { .brand:hover img { transform: rotate(-12deg) scale(1.12); } }
.brand b { font: 900 17px/1 var(--font); letter-spacing: -.02em; color: var(--ink); }
.links { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-width: 0; }
.links a { position: relative; z-index: 1; flex: none; padding: 9px 13px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--muted); text-decoration: none; transition: color .3s; }
@media (hover: hover) { .links a:hover { color: var(--ink); } }
.links a.on { color: #fff; }
.ind { position: absolute; top: 0; left: 0; width: 0; height: 0; border-radius: 999px; background: var(--blue); transition: transform .55s var(--spring), width .55s var(--spring); z-index: 0; }
.status { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 999px; border: 0; background: var(--wash); color: var(--blue); font-weight: 800; font-size: 12px; white-space: nowrap; }
.status.ex { background: var(--paper); color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.dot.live { background: var(--good); animation: ping 1.8s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(31, 79, 224, .45); } 100% { box-shadow: 0 0 0 10px transparent; } }

main { padding-top: calc(env(safe-area-inset-top, 0px) + var(--navh, 70px) + 26px); }
@media (max-width: 1360px) { .status .txt { display: none; } }
.page { display: grid; gap: clamp(72px, 9vw, 130px); padding-bottom: 60px; }
.page > *, .hero > *, .cat-head > * { min-width: 0; }
.page > .wrap { width: 100%; }
.wrap > * { min-width: 0; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 15px 22px; border-radius: 999px; border: 1.5px solid var(--blue); background: var(--blue); color: #fff; font-weight: 800; font-size: 14px; text-decoration: none; transition: background .3s, color .3s, border-color .3s, transform .25s var(--spring); }
@media (hover: hover) { .btn:hover { background: var(--blue-deep); border-color: var(--blue-deep); } }
.btn.ghost { background: var(--white); color: var(--blue); }
@media (hover: hover) { .btn.ghost:hover { background: var(--blue); color: #fff; border-color: var(--blue); } }
.btn .arr { display: inline-block; transition: transform .4s var(--spring); }
@media (hover: hover) { .btn:hover .arr { transform: translateX(5px) rotate(-45deg); } }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 20px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 13px; color: var(--text); }
.pill img { height: 18px; }
.mega { margin: 22px 0 18px; font: 900 clamp(58px, 8.4vw, 134px)/.84 var(--font); letter-spacing: -.055em; color: var(--ink); user-select: none; }
.mega .ln { display: block; white-space: nowrap; }
.w { display: inline-block; white-space: nowrap; }
.mega .ch { display: inline-block; translate: 0 calc(var(--lift, 0) * -1px); transition: translate .45s var(--spring), color .3s; animation: chIn 1s var(--ease) both; animation-delay: calc(.25s + var(--i) * 45ms); }
.mega .ln2 .ch { color: var(--blue); }
.mega .ch.hot { color: var(--blue); }
.mega .ln2 .ch.hot { color: var(--ink); }
.mega .ch.out { color: transparent; -webkit-text-stroke: 2.5px var(--blue); }
@keyframes chIn { from { transform: translateY(.6em) rotate(10deg); opacity: .1; } }
.lede { max-width: 50ch; font-size: 17px; color: var(--muted); font-weight: 600; margin: 0; }
.lede b { color: var(--ink); }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.countdown { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 34px; }
.cd-label { font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.cd { display: grid; justify-items: center; min-width: 70px; padding: 10px 12px 8px; border-radius: 16px; background: linear-gradient(160deg, var(--blue-light), var(--blue)); color: #fff; box-shadow: 0 12px 24px -16px var(--blue); }
.cd small { font: 700 10px/1 var(--font); letter-spacing: .14em; color: rgba(255, 255, 255, .75); margin-top: 4px; }
.roll { display: inline-flex; font: 800 40px/1 var(--num); height: 1em; overflow: hidden; }
.roll > span { display: flex; flex-direction: column; transition: transform .7s var(--spring); transform: translateY(calc(var(--d, 0) * -1em)); }
.roll > span > span { height: 1em; }

.hero-3d { position: relative; overflow: clip; aspect-ratio: 1 / 1; width: min(100%, 620px); justify-self: center; touch-action: pan-y; }
.hero-3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.halo { position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle at 50% 45%, var(--wash) 0%, rgba(238, 242, 255, .6) 45%, transparent 70%); }
.orbit { position: absolute; inset: 4%; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--blue) 25%, transparent); animation: spin 40s linear infinite; }
.orbit.o2 { inset: 15%; border-style: solid; border-color: var(--line); animation-duration: 26s; animation-direction: reverse; }
.orbit::after { content: ""; position: absolute; top: -6px; left: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 6px var(--wash); }
.orbit.o2::after { background: var(--sky); width: 9px; height: 9px; top: -5px; }
@keyframes spin { to { transform: rotate(360deg); } }
.floor { position: absolute; left: 22%; right: 22%; bottom: 6%; height: 7%; border-radius: 50%; background: radial-gradient(closest-side, rgba(11, 31, 122, .22), transparent); filter: blur(4px); }
.drag-hint { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--white); border: 1px solid var(--line); font-weight: 700; font-size: 12px; color: var(--muted); white-space: nowrap; }
.no3d canvas { display: none; }
.hero-3d.no3d::before { content: ""; position: absolute; inset: 22%; background: var(--mark) center / contain no-repeat; animation: bob 4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-10px); } }

/* flip stats */
.flips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.flip { width: 100%; perspective: 1100px; height: 186px; border: 0; padding: 0; background: none; text-align: left; }
.flip-in { position: relative; height: 100%; transform-style: preserve-3d; transition: transform .9s var(--ease); }
.flip.on .flip-in { transform: rotateY(180deg); }
@media (hover: hover) { .flip:hover .flip-in { transform: rotateY(180deg); } }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; }
.face.front { background: var(--white); border: 1px solid var(--line); }
.face.back { background: linear-gradient(160deg, var(--blue), var(--blue-deep)); color: #fff; transform: rotateY(180deg); }
.flip:nth-child(2n) .face.back { background: linear-gradient(160deg, var(--blue-light), var(--blue)); }
.face .big { font: 800 clamp(52px, 5vw, 70px)/.9 var(--num); color: var(--ink); }
.face .big small { font-size: .45em; color: var(--muted); }
.face .lbl { display: flex; justify-content: space-between; align-items: end; gap: 8px; font-weight: 700; font-size: 13px; color: var(--muted); }
.face .lbl i { font-style: normal; font-size: 18px; color: var(--blue); }
.face.back ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
.face.back li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid rgba(255, 255, 255, .14); padding-bottom: 4px; }
.face.back li b { font-family: var(--num); font-size: 17px; }
.face.back .eyebrow { color: rgba(255, 255, 255, .75); }

/* section heads */
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 18px; }
.sec-head h2 { font: 900 clamp(38px, 5.4vw, 74px)/.92 var(--font); letter-spacing: -.045em; color: var(--ink); }
.sec-head h2 em { font-style: normal; color: var(--blue); }
.sec-head p { margin: 12px 0 0; max-width: 52ch; color: var(--muted); font-weight: 600; }

/* segmented tabs */
.tabs { position: relative; display: inline-flex; flex-wrap: nowrap; max-width: 100%; overflow-x: auto; scrollbar-width: none; padding: 5px; border-radius: 999px; background: var(--white); border: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { position: relative; z-index: 1; flex: none; border: 0; background: none; padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: 13px; color: var(--muted); transition: color .3s; }
.tabs button.on { color: #fff; }
.tabs .ind { background: var(--blue); }

/* 3D podium stage */
.stage-sec { position: relative; border-radius: 40px; background: var(--paper); padding: clamp(22px, 3.4vw, 44px); overflow: hidden; display: grid; gap: 20px; }
.stage-sec > *, .calc-sec > *, .sec-head > * { min-width: 0; }
.stage-sec::before { content: ""; position: absolute; inset: auto -10% -45% -10%; height: 80%; background: radial-gradient(closest-side, var(--white), transparent); pointer-events: none; }
.stage { position: relative; height: clamp(400px, 52vw, 600px); touch-action: pan-y; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tags { position: absolute; inset: 0; pointer-events: none; }
.tag { position: absolute; left: 0; top: 0; display: grid; justify-items: center; gap: 2px; padding: 10px 14px 9px; min-width: 120px; border-radius: 16px; background: rgba(255, 255, 255, .97); border: 1px solid var(--line); pointer-events: auto; cursor: pointer; box-shadow: 0 14px 30px -18px rgba(11, 31, 122, .5); text-align: center; will-change: transform; }
.tag b { font-size: 14px; color: var(--ink); max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag .num { font-size: 24px; font-weight: 800; color: var(--blue); line-height: 1; }
.tag .plc { font: 800 10px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tag[data-place="1"] { border-color: var(--gold); }
.stage-foot { position: relative; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.chasers { display: flex; flex-wrap: wrap; gap: 8px; }
.chaser { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; border-radius: 999px; background: var(--white); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
.chaser .r { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: #fff; font: 800 14px/1 var(--num); }
.chaser small { color: var(--muted); font-weight: 700; }
.flat { display: none; }
.no3d .flat { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 10px; height: 100%; padding-top: 30px; }
.fl { display: grid; justify-items: center; gap: 8px; text-align: center; }
.fl .av { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(150deg, var(--blue-light), var(--blue-deep)); color: #fff; font: 900 22px/1 var(--font); border: 4px solid var(--m); }
.fl .col { width: 100%; border-radius: 16px 16px 4px 4px; display: grid; place-items: start center; padding-top: 10px; font: italic 800 42px/1 var(--num); color: #fff; animation: rise 1s var(--spring) both; transform-origin: bottom; }
@keyframes rise { from { transform: scaleY(.1); } }

/* pinned horizontal run */
.hs { position: relative; }
.hs-sticky { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 30px; overflow: hidden; }
.hs-track { display: flex; gap: 22px; padding-left: max(20px, calc((100vw - 1280px) / 2 + 20px)); padding-right: 20px; will-change: transform; }
.ccard { position: relative; flex: none; width: min(80vw, 440px); height: min(66vh, 540px); border-radius: 34px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; text-decoration: none; overflow: hidden; transform: perspective(1200px) rotateY(var(--ry, 0deg)) scale(var(--sc, 1)); transition: transform .2s linear; background: var(--white); border: 1px solid var(--line); color: var(--ink); }
.ccard.t-blue { background: linear-gradient(160deg, var(--blue-light), var(--blue) 45%, var(--blue-deep)); color: #fff; border: 0; }
.ccard.t-deep { background: linear-gradient(160deg, #1A3BB8, var(--blue-deep)); color: #fff; border: 0; }
.ccard::after { content: ""; position: absolute; right: -18%; top: -14%; width: 70%; aspect-ratio: 1; background: var(--mark) center / contain no-repeat; opacity: .07; transform: rotate(-14deg); transition: transform 1s var(--spring); }
.ccard.t-blue::after, .ccard.t-deep::after { filter: brightness(0) invert(1); opacity: .09; }
@media (hover: hover) { .ccard:hover::after { transform: rotate(4deg) scale(1.1); } }
.ccard .idx { font: 800 15px/1 var(--num); letter-spacing: .08em; opacity: .6; }
.ccard h3 { font: 900 clamp(40px, 4.4vw, 58px)/.9 var(--font); letter-spacing: -.045em; }
.ccard h3 span { display: block; opacity: .55; }
.mini { display: grid; gap: 9px; }
.mini-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) 46px; gap: 10px; align-items: center; font-weight: 700; font-size: 13px; }
.mini-row .bar { grid-column: 2 / 4; height: 5px; border-radius: 9px; background: color-mix(in srgb, currentColor 14%, transparent); overflow: hidden; margin-top: -4px; }
.mini-row .bar i { display: block; height: 100%; width: var(--w); background: currentColor; border-radius: inherit; }
.ccard.t-white .mini-row .bar i { background: var(--blue); }
.mini-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-row .s { text-align: right; font: 800 17px/1 var(--num); }
.ccard .open { display: flex; gap: 10px; align-items: center; justify-content: space-between; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 14px 18px; border-radius: 999px; background: color-mix(in srgb, currentColor 10%, transparent); font-weight: 800; font-size: 14px; }

.hs-dots { display: none; justify-content: center; gap: 2px; }
.hs-dots button { display: grid; place-items: center; min-width: 32px; height: 32px; padding: 0 4px; border: 0; background: none; }
.hs-dots button::before { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--paper-2); transition: width .45s var(--spring), background .3s; }
.hs-dots button.on::before { width: 28px; background: var(--blue); }

/* MVPs */
.mvps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.mvp { position: relative; padding: 22px; border-radius: 26px; background: var(--white); border: 1px solid var(--line); display: grid; gap: 14px; transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .3s var(--ease), box-shadow .3s; overflow: hidden; }
@media (hover: hover) { .mvp:hover { box-shadow: 0 30px 60px -36px rgba(11, 31, 122, .55); } }
.mvp::before { content: ""; position: absolute; inset: 0; background: radial-gradient(300px circle at var(--mx, 50%) var(--my, -40%), rgba(76, 134, 255, .16), transparent 60%); pointer-events: none; }
.gauge { width: 110px; height: 110px; }
.gauge circle { fill: none; stroke-width: 10; }
.gauge .bg { stroke: var(--paper-2); }
.gauge .fg { stroke: var(--c); stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: var(--off); transform: rotate(-90deg); transform-origin: 50% 50%; animation: gauge 1.6s var(--ease) both .3s; }
@keyframes gauge { from { stroke-dashoffset: 289; } }
.mvp-top { display: flex; justify-content: space-between; align-items: center; }
.mvp .val { position: absolute; right: 22px; top: 22px; text-align: right; }
.mvp .val .num { display: block; font-size: 38px; font-weight: 800; line-height: 1; color: var(--ink); }
.mvp b { font-size: 16px; color: var(--ink); }
.mvp small { display: block; color: var(--muted); font-weight: 700; font-size: 12.5px; }

/* closing */
.closing { min-height: 120vh; display: flex; align-items: center; }
.closing p { margin: 0; font: 900 clamp(48px, 9vw, 140px)/.92 var(--font); letter-spacing: -.05em; }
.closing span { color: var(--paper-2); transition: color .5s var(--ease); }
.closing span.on { color: var(--ink); }
.closing span.blue.on { color: var(--blue); }
footer { border-top: 1px solid var(--line); padding-block: 40px; }
.foot { display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: center; color: var(--muted); font-weight: 600; font-size: 13px; }
.foot img { height: 96px; }
.home-link { color: var(--blue); font-weight: 800; text-decoration: none; }
@media (hover: hover) { .home-link:hover { text-decoration: underline; } }

/* category page */
.cat-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 20px; align-items: center; }
.cat-title { font: 900 clamp(50px, 6.6vw, 108px)/.88 var(--font); letter-spacing: -.055em; color: var(--ink); margin: 16px 0 22px; }
.cat-title .ln { display: block; }
.cat-title .ln + .ln .ch { color: var(--blue); }
.cat-title .ch { display: inline-block; animation: chIn .9s var(--ease) both; animation-delay: calc(.1s + var(--i) * 35ms); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { display: grid; gap: 2px; padding: 12px 16px; border-radius: 18px; background: var(--paper); min-width: 110px; }
.fact .num { font-size: 30px; font-weight: 800; color: var(--ink); line-height: 1; }
.fact span { font-size: 12px; font-weight: 700; color: var(--muted); }
.fact.dark { background: var(--blue); } .fact.dark .num { color: #fff; } .fact.dark span { color: rgba(255,255,255,.6); }
.cat-head .stage { height: clamp(380px, 40vw, 520px); }
.cat-rule { margin-top: 16px; color: var(--muted); font-weight: 600; font-size: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.search { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); min-width: min(100%, 320px); transition: border-color .3s, box-shadow .3s; }
.search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 4px var(--wash); }
.search input { border: 0; outline: 0; background: transparent; width: 100%; font-weight: 600; }
.board { display: grid; gap: 10px; }
.row { border-radius: 22px; background: var(--white); border: 1px solid var(--line); transition: border-color .3s, box-shadow .3s, transform .3s var(--ease); }
@media (hover: hover) { .row:hover { border-color: color-mix(in srgb, var(--blue) 35%, var(--line)); box-shadow: 0 24px 50px -34px rgba(11, 31, 122, .5); transform: translateY(-2px); } }
.row[data-open="true"] { border-color: var(--blue); }
.row.flash { animation: flash 1.8s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--sky); } }
.row-main { width: 100%; display: grid; grid-template-columns: 50px 48px minmax(0, 1fr) minmax(0, 1.7fr) 96px 28px; gap: 16px; align-items: center; padding: 14px 18px; border: 0; background: none; text-align: left; }
.rank { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--paper); font: 800 24px/1 var(--num); color: var(--ink); }
.rank.r1 { background: var(--gold); color: #fff; } .rank.r2 { background: var(--silver); color: #fff; } .rank.r3 { background: var(--bronze); color: var(--ink); }
.rank.out { font: 800 9px/1 var(--font); letter-spacing: .06em; color: var(--muted); }
.ava { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(150deg, var(--blue-light), var(--blue-deep)); color: #fff; font: 900 15px/1 var(--font); transition: transform .5s var(--spring); }
@media (hover: hover) { .row:hover .ava { transform: rotate(-10deg) scale(1.08); } }
.name { min-width: 0; }
.name b { display: block; font-size: 15.5px; color: var(--ink); overflow-wrap: anywhere; }
.name small { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.stack { display: flex; height: 12px; border-radius: 99px; background: var(--paper); overflow: hidden; }
.stack i { height: 100%; width: var(--w); background: var(--c); transform-origin: left; animation: grow 1.2s var(--ease) both; animation-delay: var(--d, 0s); }
.stack i + i { box-shadow: -2px 0 0 var(--white); }
@keyframes grow { from { transform: scaleX(0); } }
.bar-labels { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--muted); }
.bar-labels span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: var(--c); margin-right: 5px; }
.total { text-align: right; }
.total .num { display: block; font-size: 36px; font-weight: 800; color: var(--ink); line-height: 1; }
.total small { font-weight: 700; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.chev { width: 28px; height: 28px; padding: 6px; border-radius: 50%; background: var(--paper); color: var(--ink); transition: transform .5s var(--spring), background .3s, color .3s; }
.row[data-open="true"] .chev { transform: rotate(180deg); background: var(--blue); color: #fff; }
.detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .55s var(--ease); }
.row[data-open="true"] .detail { grid-template-rows: 1fr; }
.detail > div { overflow: hidden; min-height: 0; }
.detail-in { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr); gap: 14px; padding: 2px 18px 18px; }
.rings { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.ring { padding: 16px; border-radius: 18px; background: var(--paper); display: grid; gap: 10px; align-content: start; min-width: 0; }
.ring-top { display: flex; align-items: center; gap: 12px; }
.ring svg { width: 64px; height: 64px; flex: none; }
.ring circle { fill: none; stroke-width: 8; }
.ring .bg { stroke: var(--paper-2); }
.ring .fg { stroke: var(--c); stroke-linecap: round; stroke-dasharray: 176; stroke-dashoffset: 176; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1.2s var(--ease) .15s; }
.row[data-open="true"] .ring .fg { stroke-dashoffset: var(--off); }
.ring-top b { display: block; font-size: 13px; color: var(--ink); }
.ring-top .num { font-size: 28px; font-weight: 800; color: var(--ink); line-height: 1; }
.ring-top .num small { font-size: 15px; color: var(--muted); }
.calc { font-size: 12.5px; line-height: 1.5; color: var(--muted); font-weight: 600; }
.calc code { font: 700 14px var(--num); color: var(--ink); }
.hint { font-size: 12.5px; font-weight: 800; color: var(--blue); }
.hint.ok { color: var(--good); }
.radar { padding: 14px; border-radius: 18px; background: linear-gradient(160deg, var(--blue), var(--blue-deep)); color: #fff; display: grid; gap: 6px; justify-items: center; }
.radar svg { width: 100%; max-width: 220px; height: auto; overflow: visible; }
.radar .lg { display: flex; gap: 14px; font-size: 11.5px; font-weight: 700; color: rgba(255,255,255,.7); }
.radar .lg i { display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: 3px; background: var(--peri); }
.radar .lg i.avg { background: transparent; border-top: 2px dashed #fff; }
.empty-board { padding: 40px; text-align: center; border: 1.5px dashed var(--line); border-radius: 22px; color: var(--muted); font-weight: 600; }

/* rules page */
.calc-sec { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 20px; padding: clamp(22px, 3.4vw, 44px); border-radius: 40px; background: var(--paper); }
.sliders { display: grid; gap: 14px; }
.sl { display: grid; gap: 12px; padding: 18px 20px; border-radius: 22px; background: var(--white); border: 1px solid var(--line); }
.sl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sl-top b { color: var(--ink); font-size: 15px; }
.sl-top .v { font: 800 24px/1 var(--num); color: var(--ink); }
.sl-top .p { font: 800 14px/1 var(--font); color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); padding: 6px 10px; border-radius: 99px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 9px; background: linear-gradient(90deg, var(--c) var(--p, 0%), var(--paper-2) var(--p, 0%)); outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--white); border: 6px solid var(--c); box-shadow: 0 6px 14px -4px rgba(11, 31, 122, .4); transition: transform .3s var(--spring); }
@media (hover: hover) { input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); } }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--white); border: 6px solid var(--c); }
.donut-box { position: relative; display: grid; place-items: center; align-content: center; gap: 14px; padding: 20px; border-radius: 28px; background: var(--white); border: 1px solid var(--line); }
.donut { width: min(100%, 300px); aspect-ratio: 1; position: relative; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut circle { fill: none; stroke-width: 22; transition: stroke-dasharray .7s var(--ease), stroke-dashoffset .7s var(--ease); }
.donut .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut .center .num { font-size: 84px; font-weight: 800; color: var(--ink); line-height: .9; }
.donut .center small { font-weight: 700; color: var(--muted); }
.verdict { font-weight: 800; color: var(--ink); text-align: center; }
.rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.rule { padding: 26px; border-radius: 28px; background: var(--white); border: 1px solid var(--line); display: grid; gap: 14px; align-content: start; }
.rule h3 { display: flex; justify-content: space-between; align-items: baseline; font: 900 30px/1 var(--font); letter-spacing: -.04em; color: var(--ink); }
.rule h3 span { font-family: var(--num); font-size: 44px; color: var(--c); }
.rule p { margin: 0; color: var(--muted); font-weight: 600; font-size: 14px; }
.formula { padding: 12px 14px; border-radius: 14px; background: var(--paper); font: 700 17px/1.3 var(--num); color: var(--ink); }
.bands { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
.band { border: 1px solid var(--line); background: var(--white); border-radius: 12px; padding: 8px 6px; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); transition: transform .3s var(--spring), border-color .2s, background .2s; }
@media (hover: hover) { .band:hover { transform: translateY(-3px); border-color: var(--c); background: color-mix(in srgb, var(--c) 7%, var(--white)); } }
.band b { display: block; font: 800 22px/1 var(--num); color: var(--c); }
.list { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-weight: 600; font-size: 14px; color: var(--text); }

/* scroll-linked reveal (falls back to fully visible) */
@supports (animation-timeline: view()) {
  .reveal { animation: reveal linear both; animation-timeline: view(); animation-range: entry 0% cover 30%; }
  @keyframes reveal { from { opacity: .2; transform: translateY(60px) scale(.96); } to { opacity: 1; transform: none; } }
}
::view-transition-old(root) { animation: none; }
::view-transition-new(root) { animation: wipe .8s cubic-bezier(.7, 0, .2, 1); }
@keyframes wipe { from { clip-path: circle(0 at var(--vx, 50%) var(--vy, 0%)); } to { clip-path: circle(150vmax at var(--vx, 50%) var(--vy, 0%)); } }
#fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 200; }

/* responsive */
/* below laptop width the nav becomes two rows: brand + status, then every tab wrapped */
@media (max-width: 1180px) {
  .nav { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; max-width: none; border-radius: 24px; flex-wrap: wrap; animation: none; }
  .brand { order: 1; } .status { order: 2; margin-left: auto; } .links { order: 3; flex-basis: 100%; }
}
@media (max-width: 1100px) {
  .mvps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .flips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .detail-in { grid-template-columns: minmax(0, 1fr); }
  .rings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .links a { padding: 8px 10px; font-size: 12.5px; }
  .hero, .cat-head, .calc-sec, .rules { grid-template-columns: minmax(0, 1fr); }
  .hero-3d { width: min(100%, 420px); }
  .hs-sticky { position: static; height: auto; }
  .hs-track { overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; padding-block: 14px; transform: none !important; scrollbar-width: none; }
  .hs-track::-webkit-scrollbar { display: none; }
  .ccard { scroll-snap-align: center; height: clamp(410px, 70vh, 480px); }
  .hs-dots { display: flex; }
  .row-main { grid-template-columns: 42px 40px minmax(0, 1fr) 70px 26px; gap: 10px; padding: 12px; }
  .row-main .bars { grid-column: 1 / -1; grid-row: 2; }
  .rank, .ava { width: 40px; height: 40px; } .rank { font-size: 20px; }
  .total .num { font-size: 28px; }
}
.links .short { display: none; }
.nav { transition: transform .4s var(--ease); }
@media (max-width: 560px) {
  /* phones: all eight tabs as a 4×2 grid with short labels; the bar tucks away while scrolling down */
  .links { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; }
  .links a { padding: 9px 2px; text-align: center; font-size: 12px; white-space: nowrap; }
  .links .full { display: none; } .links .short { display: inline; }
  .nav.tuck { transform: translateY(calc(-100% - 24px - env(safe-area-inset-top, 0px))); }
  .mvps, .rings { grid-template-columns: minmax(0, 1fr); }
  .flips { grid-template-columns: minmax(0, 1fr); }
  .cd { min-width: 60px; } .roll { font-size: 32px; }
  .tag { min-width: 0; padding: 6px 9px 5px; border-radius: 12px; } .tag b { font-size: 11.5px; max-width: 9ch; } .tag .num { font-size: 18px; } .tag .plc { font-size: 9px; }
  .status .txt { display: none; }
}
/* touch: press feedback replaces hover, and targets get roomier */
@media (hover: none) {
  .btn:active, .ccard:active, .chaser:active, .band:active, .fact:active, .tabs button:active, .links a:active, .tag:active { transform: scale(.96); }
  .row-main { transition: transform .2s var(--ease); }
  .row-main:active { transform: scale(.985); }
  .flip:active .flip-in { scale: .97; }
}
@media (pointer: coarse) {
  .tabs button { padding: 12px 16px; }
  .links a { padding: 11px 14px; }
  .search { padding: 14px 18px; }
  .chev { width: 34px; height: 34px; padding: 9px; }
  input[type="range"] { height: 10px; }
  input[type="range"]::-webkit-slider-thumb { width: 34px; height: 34px; }
}
/* lighter rendering on weaker devices (tier set by script) */
html[data-perf="1"] .nav, html[data-perf="0"] .nav { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(255, 255, 255, .97); }
html[data-perf="0"] .orbit, html[data-perf="0"] .reveal { animation: none; }
html[data-perf="0"] .floor { filter: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}

<script>
// WinterArc90 scoring — exactly the SCORING LOGIC block in the "WinterArc 90 Tracker" sheet.
// Shared by the n8n "Score & Rank" Code node and the dashboard.
//   Muscle     = MIN(25, Relative Muscle Gain % ÷ 6% × 25)
//   Body fat   = (Day 1 BF % − Day 90 BF %) × 2.5, max 25 at a 10.0 pp drop
//   Attendance = MIN(25, Days Attended ÷ 80 × 25)
//   Visual     = judges' manual score, 0–25
//   Total      = sum of the four (100). No Instagram points.

// Turn the sheet's tabs ({ title, rows: [[cell, ...], ...] }) into one record per participant.
function parseTabs(tabs) {
  const out = [];
  for (const tab of tabs) {
    const rows = tab.rows || [];
    const h = rows.findIndex(r => String(r[0] ?? '').trim().toLowerCase() === 'participant');
    if (h < 0) continue;
    const head = rows[h].map(c => String(c ?? '').trim());
    for (const r of rows.slice(h + 1)) {
      const name = String(r[0] ?? '').trim();
      if (/^scoring logic/i.test(name)) break; // participant table ends where the rules block starts
      if (!name || /^example \d+$/i.test(name)) continue;
      const rec = { Category: String(tab.title).trim() };
      head.forEach((k, i) => { if (k) rec[k] = r[i] ?? ''; });
      out.push(rec);
    }
  }
  return out;
}

// Tie-breakers from the rulebook: total, then muscle + fat score, then attendance, then % muscle gain, then fat drop.
function byRank(a, b) {
  return b['Total'] - a['Total']
    || (b['Muscle Pts'] + b['Body Fat Pts']) - (a['Muscle Pts'] + a['Body Fat Pts'])
    || b['Attendance Pts'] - a['Attendance Pts']
    || (b['Muscle Change %'] || 0) - (a['Muscle Change %'] || 0)
    || (b['Body Fat Drop (pp)'] || 0) - (a['Body Fat Drop (pp)'] || 0);
}

function scoreAll(rows, nowIso) {
  const num = v => { const s = String(v ?? '').replace(/[^0-9.\-]/g, ''); if (!s) return null; const n = parseFloat(s); return Number.isFinite(n) ? n : null; };
  const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
  const out = rows.filter(r => String(r['Participant'] ?? '').trim()).map(r => {
    const iM = num(r['Day 0 Muscle Mass']), cM = num(r['Final Muscle Mass']);
    const iF = num(r['Start Body Fat %']), cF = num(r['Final Body Fat %']);
    // The tracker's own score cells are the official result; the formula only fills in where a row has no such column (calculator).
    const sheet = k => k in r ? (num(r[k]) ?? 0) : null;
    const days = num(r['Days Attended']), vis = num(r['Visual Transformation Score /25']);
    const mPct = iM > 0 && cM != null ? (cM - iM) / iM * 100 : null;
    const mPts = sheet('Muscle Score /25') ?? (mPct == null ? 0 : clamp(mPct / 6 * 25, 0, 25));
    const fDrop = iF != null && cF != null ? iF - cF : null;
    const fPts = sheet('Fat Score /25') ?? (fDrop == null ? 0 : clamp(fDrop * 2.5, 0, 25));
    const aPts = sheet('Attendance Score /25') ?? (days == null ? 0 : clamp(days / 80 * 25, 0, 25));
    const vPts = vis == null ? 0 : clamp(vis, 0, 25);
    return {
      'Category': String(r['Category'] ?? '').trim(), 'Rank': '', 'Name': String(r['Participant']).trim(), 'Trainer': String(r['Trainer'] ?? '').trim(),
      'Muscle Change %': mPct == null ? '' : r2(mPct), 'Muscle Pts': r2(mPts),
      'Body Fat Drop (pp)': fDrop == null ? '' : r2(fDrop), 'Body Fat Pts': r2(fPts),
      'Attendance Pts': r2(aPts), 'Visual Pts': r2(vPts), 'Total': r2(sheet('Total Score /100') ?? mPts + fPts + aPts + vPts),
      'Status': 'Active', 'Updated At': nowIso,
      initialMuscle: iM, currentMuscle: cM, initialBodyFat: iF, currentBodyFat: cF, attendanceDays: days, visualScore: vis,
    };
  });
  const byCat = {};
  out.forEach(p => (byCat[p['Category']] ||= []).push(p));
  Object.values(byCat).forEach(list => list.sort(byRank).forEach((p, i) => { p['Rank'] = i + 1; }));
  return out.sort((a, b) => a['Category'].localeCompare(b['Category']) || a['Rank'] - b['Rank']);
}

let db = null, mcp = null, snapshotExec = null, exCache = null, lastSig = '';
const isExample = () => state.source === 'example' || (state.source !== 'loading' && !state.rows.length);
const viewRows = () => isExample() ? (exCache ||= exampleRows()) : state.rows;
const catRows = (key, rows) => rows.filter(r => r['Category'] === key).sort((a, b) => (a['Rank'] || 1e9) - (b['Rank'] || 1e9));
const top3 = list => { const t = list.filter(p => p['Rank']).slice(0, 3); return [t[0], t[1], t[2]]; };

function setRows(rows, source, updatedAt, execId) {
  const sig = source === 'example' ? 'ex' : JSON.stringify(rows.map(r => [keyOf(r), r['Total'], r['Rank'], r['Status']]));
  state.prev = (state.source === 'live' || state.source === 'snapshot') ? new Map(state.rows.map(r => [keyOf(r), r['Total']])) : new Map();
  const first = state.source === 'loading';
  Object.assign(state, { rows, source, updatedAt: updatedAt || now(), execId: execId || null });
  renderStatus();
  if (sig !== lastSig || first) { lastSig = sig; render(true); }
}

// ---------- routing with circular wipe ----------
const ROUTES = ['overview', 'overall', ...CATS.map(c => c.slug), 'rules'];
const route = () => { const h = location.hash.slice(1); return ROUTES.includes(h) ? h : 'overview'; };
addEventListener('pointerdown', e => { document.documentElement.style.setProperty('--vx', e.clientX + 'px'); document.documentElement.style.setProperty('--vy', e.clientY + 'px'); }, { capture: true });
addEventListener('hashchange', () => {
  const go = () => { render(); toTop(); };
  if (document.startViewTransition && !reduced && PERF.lvl > 0) document.startViewTransition(go); else go();
});

// ---------- smooth scroll ----------
let lenis = null;
if (window.Lenis && !reduced && finePointer && PERF.lvl === 2) {
  try { lenis = new Lenis({ lerp: 0.09, smoothWheel: true }); const raf = t => { lenis.raf(t); requestAnimationFrame(raf); }; requestAnimationFrame(raf); } catch (e) { lenis = null; }
}
const toTop = () => lenis ? lenis.scrollTo(0, { immediate: true }) : scrollTo(0, 0);
const scrollToEl = el => lenis ? lenis.scrollTo(el, { offset: -100 }) : el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });

// ---------- nav + status ----------
function slideInd(container, active) {
  // works for wrapped rows too: move in both axes and match the active item's size
  const ind = $('.ind', container); if (!ind || !active) return;
  ind.style.width = active.offsetWidth + 'px'; ind.style.height = active.offsetHeight + 'px'; ind.style.transform = `translate(${active.offsetLeft}px, ${active.offsetTop}px)`;
}
function renderNav(rows) {
  const r = route();
  const items = [['overview', 'Overview', 'Overview'], ['overall', 'Overall Winners', 'Overall'], ...CATS.map(c => [c.slug, c.short]), ['rules', 'Scoring']];
  const links = $('#links');
  links.innerHTML = '<span class="ind"></span>' + items.map(([s, l, sh]) => `<a href="#${s}" class="${s === r ? 'on' : ''}"><span class="full">${l}</span><span class="short">${sh || l}</span></a>`).join('');
  const on = $('a.on', links);
  requestAnimationFrame(() => { slideInd(links, on); on?.scrollIntoView({ block: 'nearest', inline: 'center' }); });
}
function statusInfo() {
  if (state.source === 'loading') return { cls: 'ex', dot: '', txt: 'Connecting' };
  if (isExample()) return { cls: 'ex', dot: '', txt: 'Tracker · ' + SNAPSHOT.asOf, title: 'Live n8n scores are not connected in this view, so this shows the WinterArc 90 Tracker as of ' + SNAPSHOT.asOf + '.' };
  return { cls: '', dot: state.source === 'live' ? 'live' : '', txt: (state.source === 'live' ? 'Live · ' : 'Updated ') + ago(state.updatedAt), title: state.execId ? 'Scored by n8n run #' + state.execId : 'Latest published scores' };
}
function renderStatus() {
  const s = statusInfo(), b = $('#status');
  const txt = state.problem ? state.problem.text : s.txt;
  b.className = 'status ' + s.cls; b.title = s.title || '';
  b.innerHTML = `<span class="dot ${s.dot}"></span><span class="txt">${esc(txt)}</span>`;
  b.onclick = () => state.problem?.run?.();
}

function radarSvg(r, avg) {
  const cx = 110, cy = 100, R = 72, ax = METRICS.map((m, i) => { const a = -Math.PI / 2 + i * Math.PI / 2; return [Math.cos(a), Math.sin(a)]; });
  const poly = vals => vals.map((v, i) => `${(cx + ax[i][0] * R * v).toFixed(1)},${(cy + ax[i][1] * R * v).toFixed(1)}`).join(' ');
  const me = METRICS.map(m => clamp(r[m.k] / m.max, 0, 1)), av = METRICS.map(m => clamp(avg[m.k] / m.max, 0, 1));
  const lbl = [[cx, cy - R - 10, 'middle'], [cx + R + 8, cy + 4, 'start'], [cx, cy + R + 18, 'middle'], [cx - R - 8, cy + 4, 'end']];
  return `<svg viewBox="0 0 220 200" aria-label="Radar of four metric scores versus category average" role="img">
    ${[.33, .66, 1].map(k => `<polygon points="${poly([k, k, k, k])}" fill="none" stroke="rgba(255,255,255,.14)"/>`).join('')}
    ${ax.map(a => `<line x1="${cx}" y1="${cy}" x2="${cx + a[0] * R}" y2="${cy + a[1] * R}" stroke="rgba(255,255,255,.14)"/>`).join('')}
    <polygon points="${poly(av)}" fill="none" stroke="#fff" stroke-dasharray="4 4" stroke-width="1.5"/>
    <polygon points="${poly(me)}" fill="rgba(163,188,255,.4)" stroke="#A3BCFF" stroke-width="2.5" stroke-linejoin="round"/>
    ${me.map((v, i) => `<circle cx="${cx + ax[i][0] * R * v}" cy="${cy + ax[i][1] * R * v}" r="4" fill="#fff"/>`).join('')}
    ${METRICS.map((m, i) => `<text x="${lbl[i][0]}" y="${lbl[i][1]}" text-anchor="${lbl[i][2]}" fill="rgba(255,255,255,.75)" font-size="11" font-weight="700" font-family="Montserrat, sans-serif">${m.label}</text>`).join('')}
  </svg>`;
}

function wireCalculator() {
  const ids = ['m', 'f', 'a', 'v']; if (!$('#s-m')) return;
  const fmts = { m: v => (+v).toFixed(1) + '%', f: v => (+v).toFixed(1) + ' pp', a: v => v + ' days', v: v => v + ' / 25' };
  const C = 2 * Math.PI * 90;
  const upd = () => {
    const v = Object.fromEntries(ids.map(id => [id, +$('#s-' + id).value]));
    const [r] = scoreAll([calcInput(v)], '');

  const avatarTex = (p, ring) => canvasTex(256, (g, n) => {
    g.beginPath(); g.arc(n / 2, n / 2, n / 2 - 6, 0, 7); g.fillStyle = ring; g.fill(); g.lineWidth = 6; g.strokeStyle = '#1F4FE0'; g.stroke();
    g.beginPath(); g.arc(n / 2, n / 2, n / 2 - 22, 0, 7);
    const gr = g.createLinearGradient(0, 0, n, n); gr.addColorStop(0, p ? '#4C86FF' : '#E5ECFC'); gr.addColorStop(1, p ? '#0B1F7A' : '#C9D8FF'); g.fillStyle = gr; g.fill();
    g.fillStyle = p ? '#fff' : '#5B6A9C'; g.font = '900 92px Montserrat, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(p ? initials(p['Name']) : '?', n / 2, n / 2 + 4);
  });
  const paint = s => { s.av.material.map?.dispose(); s.av.material.map = avatarTex(s.entry, s.ring); s.av.material.needsUpdate = true; };

  const set = list => {
    SL.forEach((s, i) => {

// ---------- data: shared snapshot + live n8n runs + optional feed ----------
function applySnapshot(d) {
  if (!d || !Array.isArray(d.rows)) return;
  snapshotExec = d.execId || null;
  if (state.source === 'live' && state.execId && +state.execId >= +(d.execId || 0)) return;
  setRows(expand(d.rows), 'snapshot', d.finishedAt ? Date.parse(d.finishedAt) : now(), d.execId);
}
async function publishSnapshot(rows, execId, finishedAt) {
  if (!db || String(snapshotExec) === String(execId)) return;
  try { await db.doc('live/snapshot').set({ v: 1, execId: String(execId), finishedAt, rows: compact(rows) }); snapshotExec = String(execId); }
  catch (e) { /* viewers without edit access read the snapshot instead */ }
}
let fetchingExec = null;
async function loadExecution(ex) {
  if (fetchingExec === ex.id || String(state.execId) === String(ex.id)) return;
  fetchingExec = ex.id;
  try {
    const res = await mcp.callTool('n8n', 'get_execution', { workflowId: WORKFLOW_ID, executionId: String(ex.id), includeData: true, nodeNames: ['Score & Rank'] });
    const items = res.payload?.data?.resultData?.runData?.['Score & Rank']?.[0]?.data?.main?.[0] || [];
    const rows = items.map(i => i.json).filter(Boolean);
    state.problem = null;
    setRows(rows, 'live', Date.parse(ex.stoppedAt || ex.startedAt) || now(), ex.id);
    publishSnapshot(rows, ex.id, ex.stoppedAt || ex.startedAt || new Date().toISOString());
  } catch (e) { handleMcpError(e); }
  finally { fetchingExec = null; }
}
function handleMcpError(e) {
  const code = e?.code;
  if (['server_not_connected', 'selection_required', 'not_granted', 'capability_disabled', 'capability_removed'].includes(code)) state.problem = null;
  else if (code === 'needs_reauth') state.problem = { text: 'Reconnect n8n in Settings → Connectors' };
  else if (code === 'approval_required' || code === 'not_in_manifest') state.problem = { text: 'Tap to allow live n8n scores', run: () => pollOnce() };
  else if (code === 'tool_error') state.problem = { text: 'n8n error: ' + String(e.message || '').slice(0, 60) };
  else state.problem = { text: 'n8n unreachable · showing last scores' };
  renderStatus();
}
const pickLatest = payload => (payload?.data || []).filter(x => x.status === 'success' && x.mode !== 'manual').sort((a, b) => +b.id - +a.id)[0];
async function pollOnce() {
  try { const res = await mcp.callTool('n8n', 'search_executions', { workflowId: WORKFLOW_ID, status: ['success'], limit: 20 }, { cache: false }); const ex = pickLatest(res.payload); if (ex) loadExecution(ex); }
  catch (e) { handleMcpError(e); }
}
async function pollFeed() {
  try {
    const res = await fetch(FEED_URL, { cache: 'no-store' }); if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json(), rows = Array.isArray(d) ? d : d.rows || [];
    state.problem = null; setRows(rows, 'live', Date.parse(d.updatedAt) || now(), null);
  } catch (e) {
    state.problem = { text: 'Score feed unreachable, retrying' };
    if (state.source === 'loading') setRows([], 'example'); else renderStatus();
  }
  setTimeout(pollFeed, 60000);
}

// ---------- preloader + boot ----------
function preloader() {
  const pre = $('#pre'), line = $('.pre-line', pre), num = $('.pre-num', pre), t0 = performance.now(), MIN = reduced ? 0 : PERF.lvl > 1 ? 1400 : 700;
  const tick = t => {
    const k = Math.min(1, (t - t0) / MIN), ready = state.source !== 'loading';
    const p = Math.round((ready ? k : Math.min(k, .9)) * 100);
    line.style.setProperty('--p', p); num.textContent = p + '%';
    if (k >= 1 && ready) { pre.classList.add('out'); setTimeout(() => pre.remove(), 1100); return; }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function boot() {
  preloader();
  new ResizeObserver(([e]) => document.documentElement.style.setProperty('--navh', Math.round(e.target.getBoundingClientRect().height) + 'px')).observe($('.nav'));
  PERF.subs.add(l => { if (l === 0) render(true); });
  const use = window.claude?.use?.bind(window.claude);
  setTimeout(() => { if (state.source === 'loading') setRows([], 'example'); }, 3000);
  if (!use) { FEED_URL ? pollFeed() : setRows([], 'example'); return; }
  use('db').then(d => {

  setInterval(renderStatus, 30000);
